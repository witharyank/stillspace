<!DOCTYPE html>
<html>

<head>

<!-- =========================================================
SECTION 1 — PAGE TITLE + LEAFLET MAP LIBRARIES MAPPING
========================================================= -->

<title>StillSpace - Smart Calm Routing</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =========================================================
SECTION 2 — GLOBAL STYLING of page
========================================================= -->

<style>

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:#f5f7fb;
}


/* =========================================================
HEADER BAR
========================================================= */

#header{
background:linear-gradient(90deg,#4facfe,#00f2fe);
color:white;
padding:16px 24px;
font-size:22px;
font-weight:600;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}


/* =========================================================
INPUT CONTROL PANEL
========================================================= */

#controls{
display:flex;
gap:12px;
padding:14px;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
align-items:center;
flex-wrap:wrap;
}

input{
padding:10px;
border-radius:6px;
border:1px solid #ccc;
width:320px;
font-size:14px;
}


/* =========================================================
BUTTON STYLING
========================================================= */

button{
padding:10px 18px;
border:none;
border-radius:6px;
background:linear-gradient(135deg,#4facfe,#00c6ff);
color:white;
font-weight:600;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:translateY(-1px);
box-shadow:0 4px 8px rgba(0,0,0,0.15);
}

#resetBtn{
background:linear-gradient(135deg,#ff6b6b,#ff3b3b);
}


/* =========================================================
MAP CONTAINER
========================================================= */

#map{
height:70vh;
margin:12px;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}


/* =========================================================
BOTTOM INFO PANEL
========================================================= */

#infoPanel{
display:flex;
justify-content:space-between;
padding:15px;
background:white;
border-top:1px solid #ddd;
font-size:14px;
}


/* =========================================================
ROUTE LEGEND
========================================================= */

#legend{
display:flex;
gap:20px;
}

.legendItem{
display:flex;
align-items:center;
gap:6px;
}

.colorBox{
width:14px;
height:14px;
border-radius:3px;
}

.fastest{background:red;}
.calm{background:green;}

#stats{
color:#444;
}

</style>
</head>


<body>

<!-- =========================================================
SECTION 3 — HEADER
========================================================= -->

<div id="header">
🌿 StillSpace — Smart Calm Routing
</div>


<!-- =========================================================
SECTION 4 — USER INPUT CONTROLS
========================================================= -->

<div id="controls">

<input id="moodInput"
placeholder="Describe your mood (e.g. peaceful sunset walk, quiet ride...)"/>

<button onclick="getSmartRoute()">
Find Smart Route
</button>

<button id="resetBtn" onclick="resetMap()">
Reset
</button>

</div>


<!-- =========================================================
SECTION 5 — MAP DISPLAY AREA
========================================================= -->

<div id="map"></div>


<!-- =========================================================
SECTION 6 — ROUTE INFORMATION PANEL
========================================================= -->

<div id="infoPanel">

<div id="legend">

<div class="legendItem">
<div class="colorBox fastest"></div>
Fastest Route
</div>

<div class="legendItem">
<div class="colorBox calm"></div>
Calm Route
</div>

</div>

<div id="stats">
<b>Mode:</b> <span id="modeText">-</span> |
<b>Explanation:</b> <span id="explanationText">-</span>
</div>
</div>
<script>


/* =========================================================
SECTION 7 — INITIALIZE MAP
========================================================= */

let map = L.map('map').setView([30.7333, 76.7794], 15);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{ attribution:'© OpenStreetMap' }
).addTo(map);



/* =========================================================
SECTION 8 — MAP STATE VARIABLES
========================================================= */

let startPoint=null;
let endPoint=null;

let startMarker=null;
let endMarker=null;

let calmLayer=null;
let fastestLayer=null;

/* =========================================================
SECTION 9 — USER CLICK HANDLING
User clicks map to select start and end
========================================================= */

map.on('click',function(e){

if(!startPoint){

startPoint=e.latlng;

startMarker=L.marker(startPoint)
.addTo(map)
.bindPopup("Start")
.openPopup();

}

else if(!endPoint){

endPoint=e.latlng;

endMarker=L.marker(endPoint)
.addTo(map)
.bindPopup("End")
.openPopup();

}

});



/* =========================================================
SECTION 10 — REQUEST SMART ROUTE FROM BACKEND
========================================================= */

function getSmartRoute(){

const textInput=document.getElementById("moodInput").value;

if(!startPoint || !endPoint){
alert("Click start and end points first.");
return;
}

fetch("/smart_route",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

text:textInput,
start_lat:startPoint.lat,
start_lon:startPoint.lng,
end_lat:endPoint.lat,
end_lon:endPoint.lng

})

})

.then(res=>res.json())

.then(data=>{


/* Remove previous routes */

if(calmLayer) map.removeLayer(calmLayer);
if(fastestLayer) map.removeLayer(fastestLayer);


/* Draw fastest route */

fastestLayer=L.polyline(data.fastest_route,{
color:"red",
weight:4,
opacity:0.7
}).addTo(map);


/* Draw calm route */

calmLayer=L.polyline(data.calm_route,{
color:"green",
weight:6,
opacity:0.9
}).addTo(map);


/* Zoom map to route */

map.fitBounds(calmLayer.getBounds());


/* Update explanation panel */

document.getElementById("modeText").innerText=data.mode;
document.getElementById("explanationText").innerText=data.explanation;

})

.catch(err=>{
console.error(err);
alert("Backend error. Check console.");
});

}


/* =========================================================
SECTION 11 — RESET MAP STATE in case of reset options
========================================================= */

function resetMap(){

if(startMarker) map.removeLayer(startMarker);
if(endMarker) map.removeLayer(endMarker);
if(calmLayer) map.removeLayer(calmLayer);
if(fastestLayer) map.removeLayer(fastestLayer);

startPoint=null;
endPoint=null;

document.getElementById("modeText").innerText="-";
document.getElementById("explanationText").innerText="-";

}

</script>

</body>
</html>
