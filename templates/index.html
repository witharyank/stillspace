<!DOCTYPE html>
<html>
<head>
    <title>StillSpace - Smart Calm Routing</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #controls {
            padding: 12px;
            background: #f4f4f4;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #map {
            height: 80vh;
        }

        #infoPanel {
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="controls">
    <input id="moodInput"
           placeholder="Describe your mood (e.g., peaceful sunset walk)" />

    <button onclick="getSmartRoute()">
        Find Smart Route
    </button>
</div>

<div id="map"></div>

<div id="infoPanel">
    <strong>Mode:</strong> <span id="modeText">-</span><br>
    <strong>Explanation:</strong> <span id="explanationText">-</span>
</div>

<script>
let map = L.map('map').setView([30.7333, 76.7794], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

let startPoint = null;
let endPoint = null;
let calmLayer = null;
let fastestLayer = null;

map.on('click', function(e) {

    if (!startPoint) {
        startPoint = e.latlng;
        L.marker(startPoint).addTo(map).bindPopup("Start").openPopup();
    }
    else if (!endPoint) {
        endPoint = e.latlng;
        L.marker(endPoint).addTo(map).bindPopup("End").openPopup();
    }
});

function getSmartRoute() {

    const textInput = document.getElementById("moodInput").value;

    if (!startPoint || !endPoint) {
        alert("Click start and end points first.");
        return;
    }

    fetch("/smart_route", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: textInput,
            start_lat: startPoint.lat,
            start_lon: startPoint.lng,
            end_lat: endPoint.lat,
            end_lon: endPoint.lng
        })
    })
    .then(response => response.json())
    .then(data => {

        if (calmLayer) map.removeLayer(calmLayer);
        if (fastestLayer) map.removeLayer(fastestLayer);

        // 🔴 Fastest Route
        fastestLayer = L.polyline(data.fastest_route, {
            color: "red",
            weight: 4,
            opacity: 0.7
        }).addTo(map);

        // 🟢 Calm Route
        calmLayer = L.polyline(data.calm_route, {
            color: "green",
            weight: 6.2 ,
            opacity: 5.6
        }).addTo(map);

        map.fitBounds(calmLayer.getBounds());

        document.getElementById("modeText").innerText = data.mode;
        document.getElementById("explanationText").innerText = data.explanation;
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong. Check backend.");
    });
}
</script>

</body>
</html>
